<script>
/* ---------- état et persistance ---------- */
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const RO=()=>S.cfg.vitrine!==false;
const clone=o=>JSON.parse(JSON.stringify(o));
const EMPTY=()=>({accounts:[],cats:[],subs:[],debts:[],goals:[],recs:[],provs:[],rules:[],recon:[],thr:0.8});
let S={cfg:EMPTY(),months:{},empty:true},DB=null,mode="init";
const LKEY="mescomptes-v2";
function loadLocal(){try{const s=JSON.parse(localStorage.getItem(LKEY));if(s&&s.cfg){S.cfg=Object.assign(EMPTY(),s.cfg);S.months=s.months||{};S.empty=false}}catch(e){}}
function saveLocal(){try{localStorage.setItem(LKEY,JSON.stringify({cfg:S.cfg,months:S.months}))}catch(e){}}
let chain=Promise.resolve();
function queue(fn){chain=chain.then(fn).catch(e=>toast("Enregistrement impossible : "+((e&&e.message)||e)));return chain}
function saveCfg(){S.empty=false;if(DB)queue(()=>DB.doc("cfg/main").set(clone(S.cfg)));else saveLocal();render()}
function saveMonth(k){S.empty=false;if(DB)queue(()=>DB.doc("tx/"+k).set({items:clone(S.months[k]||[])}));else saveLocal();render()}
function toast(t){const e=$("toast");e.textContent=t;e.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>e.hidden=true,2600)}
/* ---------- utilitaires ---------- */
const MOIS=["janvier","février","mars","avril","mai","juin","juillet","août","septembre","octobre","novembre","décembre"];
const MC=["janv.","févr.","mars","avr.","mai","juin","juil.","août","sept.","oct.","nov.","déc."];
const eur=n=>(n<-0.004?"−":"")+Math.abs(n).toLocaleString("fr-FR",{minimumFractionDigits:2,maximumFractionDigits:2})+" €";
const eur0=n=>(n<-0.5?"−":"")+Math.abs(n).toLocaleString("fr-FR",{maximumFractionDigits:0})+" €";
const pc=n=>Math.round(n*100)+" %";
const R2=n=>Math.round(n*100)/100;
const now=new Date(),TODAY=now.getFullYear()+"-"+String(now.getMonth()+1).padStart(2,"0")+"-"+String(now.getDate()).padStart(2,"0");
const mOf=d=>(+d.slice(0,4))*12+(+d.slice(5,7)-1);
const kOf=m=>Math.floor(m/12)+"-"+String(m%12+1).padStart(2,"0");
const dOf=(m,day)=>kOf(m)+"-"+String(day).padStart(2,"0");
const dfr=d=>d?new Date(d+"T00:00:00").toLocaleDateString("fr-FR",{day:"numeric",month:"short"}):"";
const dfy=d=>d?new Date(d+"T00:00:00").toLocaleDateString("fr-FR",{day:"numeric",month:"short",year:"numeric"}):"";
const CUR=mOf(TODAY);
const num=s=>{const v=parseFloat(String(s).replace(/\s/g,"").replace("€","").replace(",","."));return isFinite(v)?v:NaN};
const cls=n=>n<-0.004?"neg":n>0.004?"pos":"";
function allTx(){const a=[];for(const k of Object.keys(S.months).sort())for(const t of S.months[k])a.push(t);return a.sort((x,y)=>x.d<y.d?-1:x.d>y.d?1:0)}
const dot=i=>`<i class="dot" style="background:${COL(i)}"></i>`;
const catIdx=sub=>{const x=subOf(sub);return x?Math.max(0,S.cfg.cats.findIndex(c=>c.n===x.p)):6};
const ACOL={Courant:0,Épargne:2,Liquide:1,Carte:4,Autre:6};
const catOf=n=>S.cfg.cats.find(c=>c.n===n);
const subOf=n=>S.cfg.subs.find(s=>s.n===n);
const prin=s=>{const x=subOf(s);return x?x.p:"?"};
const uid=()=>"t"+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
/* ---------- calculs ---------- */
const inM=(t,m)=>mOf(t.d)===m;
function sums(m,txs){const a=(txs||allTx()).filter(t=>inM(t,m));const rev=a.filter(t=>t.amt>0).reduce((s,t)=>s+t.amt,0),dep=-a.filter(t=>t.amt<0).reduce((s,t)=>s+t.amt,0);return{rev,dep,sol:rev-dep,tx:a}}
function balances(){const T=allTx();return S.cfg.accounts.map(a=>({n:a.n,bal:a.init+T.filter(t=>t.acc===a.n).reduce((s,t)=>s+t.amt,0)}))}
const budOfCat=c=>S.cfg.subs.filter(s=>s.p===c).reduce((a,s)=>a+s.b,0);
const spentIn=(m,pred)=>-allTx().filter(t=>inM(t,m)&&t.amt<0&&pred(t)).reduce((s,t)=>s+t.amt,0);
function debtInfo(d){const rem=Math.max(0,d.cap-d.paid),r=d.rate/12;let n=0;
 if(rem>0&&d.pay>0){if(r===0)n=Math.ceil(rem/d.pay);else{const x=1-r*rem/d.pay;n=x>0?Math.ceil(-Math.log(x)/Math.log(1+r)):999}}
 return{rem,n,int:rem*r,pct:d.cap?(d.cap-rem)/d.cap:0}}
const PER={Mensuel:1,Trimestriel:3,Semestriel:6,Annuel:12};
function occurs(r,m){const p=PER[r.freq];if(!p||r.active==="Non"||!r.next)return false;const diff=m-mOf(r.next);return((diff%p)+p)%p===0}
const matches=(t,r)=>t.lbl.toLowerCase().includes(r.n.toLowerCase());
function recStatus(r,m){const T=allTx();const here=T.some(t=>inM(t,m)&&matches(t,r));if(here)return"Saisi";
 const day=Math.min(+r.next.slice(8,10)||1,28);return dOf(m,day)<=TODAY?"Absent":"À venir"}
function lastAmt(r){const T=allTx().filter(t=>matches(t,r));return T.length?T[T.length-1].amt:null}
function checks(){const T=allTx(),out=[];const keyc={};
 T.forEach(t=>{const k=[t.d,t.acc,t.lbl,t.amt].join("|");keyc[k]=(keyc[k]||0)+1});
 T.forEach(t=>{const f=[];
  if(keyc[[t.d,t.acc,t.lbl,t.amt].join("|")]>1)f.push("Doublon possible");
  if(t.amt<0){const same=T.filter(x=>x.sub===t.sub&&x.amt<0);if(same.length>=4){const avg=same.reduce((s,x)=>s-x.amt,0)/same.length;if(-t.amt>30&&-t.amt>3*avg)f.push("Montant inhabituel pour cette sous-catégorie")}}
  if(!subOf(t.sub))f.push("Sous-catégorie inconnue");
  if(f.length)out.push({t,f:f.join(". ")})});return out}
function recoRows(){const T=allTx();return S.cfg.accounts.map(a=>{const rc=S.cfg.recon.find(r=>r.acc===a.n)||{};const mine=T.filter(t=>t.acc===a.n);
 const pointed=a.init+mine.filter(t=>t.ok).reduce((s,t)=>s+t.amt,0),np=mine.filter(t=>!t.ok);
 return{n:a.n,date:rc.date||"",bal:rc.bal,pointed,ecart:rc.bal==null||rc.bal===""?null:R2(rc.bal-pointed),np:np.length,npAmt:np.reduce((s,t)=>s+t.amt,0)}})}
function varBudget(m){const vars=S.cfg.cats.filter(c=>c.sens==="Dépense"&&c.type==="Variable");
 const bv=vars.reduce((a,c)=>a+budOfCat(c.n),0),sv=vars.reduce((a,c)=>a+spentIn(m,t=>prin(t.sub)===c.n),0);
 const dim=new Date(Math.floor(m/12),m%12+1,0).getDate();const done=m===CUR?now.getDate()-1:(m<CUR?dim:0),left=dim-done;
 const per=left>0?Math.max(0,bv-sv)/left:0;let msg;
 if(!bv)msg="Aucune catégorie « Variable » avec un budget : réglez-les dans Plus > Catégories.";
 else if(left===0)msg=sv>bv?"Mois terminé : budget variable dépassé de "+eur(sv-bv)+".":"Mois terminé : budget variable respecté.";
 else if(done===0)msg="Le mois commence : "+eur(per)+" par jour disponibles.";
 else{const pr=sv/done*dim;msg=pr>bv?"À ce rythme, vous dépasserez le budget variable de "+eur0(pr-bv)+" ; il reste "+eur0(Math.max(0,bv-sv))+" à dépenser.":"À ce rythme, vous finirez "+eur0(bv-pr)+" sous le budget variable."}
 return{bv,sv,left,per,msg}}
function totals(){const b=balances().reduce((s,x)=>s+x.bal,0),d=S.cfg.debts.reduce((s,x)=>s+debtInfo(x).rem,0);return{b,d,net:b-d}}
function goalInfo(g){const reste=Math.max(0,g.target-g.saved),mo=g.date?Math.max(0,mOf(g.date)-CUR):0;return{reste,mo,per:reste<=0?0:mo===0?reste:reste/mo,pct:g.target?g.saved/g.target:0}}
function provInfo(p){const reste=Math.max(0,p.amt-p.saved),mo=p.due?Math.max(1,mOf(p.due)-CUR):1;return{reste,mo,per:reste/mo}}
function forecast(){const start=CUR+1;let bal=totals().b;const rows=[];
 const dinfo=S.cfg.debts.map(debtInfo);
 for(let k=0;k<12;k++){const m=start+k;let inc=0,out=0;
  S.cfg.recs.forEach(r=>{if(occurs(r,m)){if(r.sens==="Revenu")inc+=r.amt;else out+=r.amt}});
  S.cfg.debts.forEach((d,i)=>{if(k<dinfo[i].n)out+=Math.min(d.pay,dinfo[i].rem)});
  bal+=inc-out;rows.push({m,inc,out,net:inc-out,bal})}
 return rows}

function line(labels,vals){const W=360,H=160,L=44,B=22,T=10;const mn=Math.min(0,...vals),mx=Math.max(1,...vals),rg=mx-mn||1;

function serialISO(v){if(v instanceof Date)return v.getFullYear()+"-"+String(v.getMonth()+1).padStart(2,"0")+"-"+String(v.getDate()).padStart(2,"0");
 if(typeof v==="number"&&v>20000){const d=new Date((Math.floor(v)-25569)*86400000);return d.getUTCFullYear()+"-"+String(d.getUTCMonth()+1).padStart(2,"0")+"-"+String(d.getUTCDate()).padStart(2,"0")}
 if(typeof v==="string"){const m=v.match(/^(\d{4})-(\d{2})-(\d{2})/);if(m)return m[0];const f=v.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);if(f)return f[3]+"-"+f[2].padStart(2,"0")+"-"+f[1].padStart(2,"0")}return""}

 const g=n=>wb.Sheets[n]?XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,raw:true,defval:null}):[];
 const rows=(n,a,b)=>g(n).slice(a-1,b);const cfg=EMPTY();
 rows("Comptes",5,24).forEach(r=>{if(T0(r[0]))cfg.accounts.push({n:T0(r[0]),t:T0(r[1])||"Autre",e:T0(r[2]),init:N0(r[3]),date:serialISO(r[5])})});
 const cat=g("Catégories");
 cat.slice(4,29).forEach(r=>{if(T0(r[0]))cfg.cats.push({n:T0(r[0]),sens:T0(r[1])||"Dépense",type:T0(r[3])})});
 cat.slice(4,124).forEach(r=>{if(T0(r[4]))cfg.subs.push({n:T0(r[4]),p:T0(r[5]),b:N0(r[7])})});
 rows("Dettes",5,16).forEach(r=>{if(T0(r[0]))cfg.debts.push({n:T0(r[0]),cr:T0(r[1]),cap:N0(r[2]),rate:N0(r[3]),pay:N0(r[4]),start:serialISO(r[5]),paid:N0(r[6])})});
 rows("Objectifs",5,14).forEach(r=>{if(T0(r[0]))cfg.goals.push({n:T0(r[0]),target:N0(r[1]),date:serialISO(r[2]),saved:N0(r[3])})});
 rows("Récurrents",5,44).forEach(r=>{if(T0(r[0]))cfg.recs.push({n:T0(r[0]),sens:T0(r[1])||"Dépense",sub:T0(r[2]),acc:T0(r[3]),amt:N0(r[4]),freq:T0(r[5])||"Mensuel",next:serialISO(r[6]),active:T0(r[7])||"Oui"})});
 rows("Provisions",5,24).forEach(r=>{if(T0(r[0])&&T0(r[6])!=="Oui")cfg.provs.push({n:T0(r[0]),type:T0(r[4])||"Ponctuel",amt:N0(r[2]),due:serialISO(r[7])||serialISO(r[3]),saved:N0(r[5])})});
 rows("Règles import",5,104).forEach(r=>{if(T0(r[0])&&T0(r[1]))cfg.rules.push({kw:T0(r[0]),sub:T0(r[1])})});
 rows("Rapprochement",5,24).forEach(r=>{if(T0(r[0])&&typeof r[2]==="number")cfg.recon.push({acc:T0(r[0]),date:serialISO(r[1]),bal:r[2]})});
 const b=g("Budget");if(b[3]&&typeof b[3][1]==="number")cfg.thr=b[3][1];
 const months={};let n=0,bad=0;
 g("Transactions").slice(4,5000).forEach((r,i)=>{const d=serialISO(r[0]);if(!d||typeof r[4]!=="number"){if((d&&r[4]!=null&&r[4]!==""&&typeof r[4]!=="number")||(!d&&typeof r[4]==="number"))bad++;return}n++;(months[d.slice(0,7)]=months[d.slice(0,7)]||[]).push({id:"x"+String(n).padStart(5,"0"),d,acc:T0(r[1]),sub:T0(r[2]),lbl:T0(r[3]),amt:R2(r[4]),ok:T0(r[6])==="Oui"})});
 const warn=[];
  ["Dettes","Objectifs","Récurrents","Provisions","Règles import","Rapprochement","Budget"].forEach(sh=>{if(!wb.Sheets[sh])warn.push("L'onglet « "+sh+" » est introuvable (renommé ou supprimé ?) : ses données ne seront pas mises à jour.")});
  const flow=(sh,col,last,lab,max)=>{const a=g(sh);let k=0;for(let i=last;i<last+2;i++){const v=a[i]&&T0(a[i][col]);if(v&&!/^total/i.test(v))k++}if(k)warn.push(lab+" : la ligne "+(last+1)+" de l'onglet « "+sh+" » est remplie, au-delà de la capacité ("+max+"). Les lignes suivantes ne seront pas lues.")};
  flow("Comptes",0,24,"Comptes",20);flow("Catégories",0,29,"Catégories principales",25);flow("Catégories",4,124,"Sous-catégories",120);flow("Dettes",0,16,"Dettes",12);flow("Objectifs",0,14,"Objectifs",10);flow("Récurrents",0,44,"Récurrents",40);flow("Provisions",0,24,"Provisions",20);flow("Règles import",0,104,"Règles d'import",100);
  if(g("Transactions").slice(5000,5003).some(r=>serialISO(r[0])&&typeof r[4]==="number"))warn.push("Transactions : des opérations se trouvent au-delà de la ligne 5000 et ne seront pas lues.");
  if(bad)warn.push(bad+" ligne(s) de Transactions ignorée(s) (date ou montant manquant ou illisible).");
  const sn=new Set(cfg.subs.map(x=>x.n)),an=new Set(cfg.accounts.map(x=>x.n));let us=0,ua=0;Object.values(months).forEach(a=>a.forEach(t=>{if(!sn.has(t.sub))us++;if(!an.has(t.acc))ua++}));
  if(us)warn.push(us+" opération(s) avec une sous-catégorie absente de l'onglet Catégories.");
  if(ua)warn.push(ua+" opération(s) avec un compte absent de l'onglet Comptes.");
  const cur=Object.values(S.months).reduce((a,m)=>a+m.length,0);if(cur>0&&n<cur*0.8)warn.push("L'application contient "+cur+" opérations, ce classeur n'en contient que "+n+".");
  return{cfg,months,n,warn}}

function parseStatement(txt,acc){const T=allTx();const out=[];
 txt.split(/\r?\n/).forEach(line=>{line=line.trim();if(!line)return;const sep=line.includes(";")?";":line.includes("\t")?"\t":",";const c=line.split(sep).map(x=>x.trim().replace(/^"|"$/g,""));
  let d=null;const m1=c[0].match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{2,4})$/),m2=c[0].match(/^(\d{4})-(\d{2})-(\d{2})/);
  if(m1){const yy=m1[3].length===2?"20"+m1[3]:m1[3];d=yy+"-"+m1[2].padStart(2,"0")+"-"+m1[1].padStart(2,"0")}else if(m2)d=m2[0];
  if(!d)return;const rest=c.slice(1);const nums=[];let lbl=[];rest.forEach(x=>{const n=num(x);if(x!==""&&!isNaN(n)&&/^[-+−]?\s*[\d\s.,]+\s*€?$/.test(x))nums.push({n:n*(/^[−]/.test(x)?-1:1),x});else if(x!=="")lbl.push(x)});
  if(!nums.length)return;let amt;if(nums.length>=2){const deb=nums[0].n,cre=nums[1].n;amt=Math.abs(cre)>0&&deb===0?Math.abs(cre):-Math.abs(deb)||Math.abs(cre)}else amt=nums[0].n;
  const label=lbl.join(" ");let sub="";S.cfg.rules.forEach(r=>{if(r.kw&&label.toLowerCase().includes(r.kw.toLowerCase()))sub=r.sub});
  const dup=T.some(t=>t.d===d&&t.acc===acc&&Math.abs(t.amt-amt)<0.005);out.push({d,lbl:label,amt:R2(amt),sub,dup,on:!dup&&!!sub})});return out}
