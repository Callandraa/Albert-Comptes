<script>
/* ---------- état et persistance ---------- */
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const RO=()=>S.cfg.vitrine!==false;
const clone=o=>JSON.parse(JSON.stringify(o));
const EMPTY=()=>({accounts:[],cats:[],subs:[],debts:[],goals:[],recs:[],provs:[],rules:[],recon:[],thr:0.8});
let S={cfg:EMPTY(),months:{},empty:true},DB=null,mode="init";
const LKEY="mescomptes-v2";
function loadLocal(){try{const s=JSON.parse(localStorage.getItem(LKEY));if(s&&s.cfg){S.cfg=Object.assign(EMPTY(),s.cfg);S.months=s.months||{};S.empty=false}}catch(e){}
 try{if(S.empty===false&&localStorage.getItem("mc-base")===null)localStorage.setItem("mc-base",JSON.stringify(snapTx()))}catch(e){}}
function saveLocal(){try{localStorage.setItem(LKEY,JSON.stringify({cfg:S.cfg,months:S.months}))}catch(e){}}
let chain=Promise.resolve();
function queue(fn){chain=chain.then(fn).catch(e=>toast("Enregistrement impossible : "+((e&&e.message)||e)));return chain}
function saveCfg(){S.empty=false;if(DB)queue(()=>DB.doc("cfg/main").set(clone(S.cfg)));else saveLocal();render()}
const BASEK="mc-base";
const baseGet=()=>{try{return JSON.parse(localStorage.getItem(BASEK))}catch(e){return null}};
const baseSet=b=>{try{localStorage.setItem(BASEK,JSON.stringify(b))}catch(e){}};
const snapTx=()=>{const m={};allTxRaw().forEach(t=>{if(!t.a)m[t.id]=[t.d,t.acc,t.sub,t.lbl||"",t.amt,t.ok?1:0]});return m};
const CHGON=()=>mode!=="db"&&baseGet()!==null;
const CHGL=["date","compte","sous-catégorie","libellé","montant","pointé"];
const cfmt=(i,v)=>i===0?dfy(v):i===4?eur(v):i===5?(v?"Oui":"Non"):(v===""?"(vide)":v);
function chgList(){if(!CHGON())return[];const b=baseGet(),cur={};allTxRaw().forEach(t=>{if(!t.a)cur[t.id]=t});const out=[];
 Object.keys(b).forEach(id=>{const o=b[id],t=cur[id];if(!t){out.push({id,type:"del",o});return}
  const n=[t.d,t.acc,t.sub,t.lbl||"",t.amt,t.ok?1:0],df=[];n.forEach((v,i)=>{if(v!==o[i])df.push(i)});if(df.length)out.push({id,type:"mod",o,n,df})});
 return out.sort((x,y)=>(x.o[0]<y.o[0]?-1:1))}
const chgTxt=l=>{const w=o=>`${dfy(o[0])} · ${o[3]||"sans libellé"} · ${eur(o[4])} (${o[1]})`;
 return l.map(c=>c.type==="del"?`SUPPRIMER : ${w(c.o)}`:(c.df.length===1&&c.df[0]===5?`POINTER « ${cfmt(5,c.n[5])} » : ${w(c.o)}`:`MODIFIER : ${w(c.o)}\n   → ${c.df.map(i=>`${CHGL[i]} : ${cfmt(i,c.o[i])} devient ${cfmt(i,c.n[i])}`).join(" ; ")}`)).join("\n")};
const pend=()=>allTxRaw().filter(t=>t.a&&!t.x);
const pendTSV=()=>pend().map(t=>[t.d,t.acc,t.sub,String(t.lbl||"").replace(/[\t\r\n]+/g," "),String(t.amt).replace(".",",")].join("\t")).join("\n");
const pendOK=()=>pend().map(t=>t.ok?"Oui":"Non").join("\n");
function editTx(t){const accs=[...optAccs()];if(!accs.includes(t.acc))accs.unshift(t.acc);const subs=S.cfg.subs.map(x=>x.n);if(!subs.includes(t.sub))subs.unshift(t.sub);const sg=t.amt<0?"d":"r";
 return`<button class="link back" data-etx="">${route.eret?"‹ Retour":"‹ Opérations"}</button><form id="ef" class="card" data-id="${t.id}"><b>Modifier l'opération</b>${(()=>{const c=checks().find(x=>x.t.id===t.id);return c?`<div class="msg" style="margin:8px 0"><b>À vérifier :</b> ${esc(c.f)}.<br><button type="button" class="link" data-nc="${t.id}">Tout est correct : ne plus le signaler</button></div>`:""})()}${t.a?"":`<div class="muted" style="margin:6px 0">Cette opération vient du classeur : modifiez-la aussi dans le tableur, sinon elle reviendra comme avant au prochain import.</div>`}
 <label for="ef_t">Type</label><select id="ef_t"><option value="d"${sg==="d"?" selected":""}>Dépense</option><option value="r"${sg==="r"?" selected":""}>Revenu</option></select>
 <label for="ef_a">Montant (€)</label><input id="ef_a" inputmode="decimal" value="${esc(String(Math.abs(t.amt)).replace(".",","))}" autocomplete="off" required>
 <label for="ef_s">Sous-catégorie</label><select id="ef_s">${subs.map(n=>`<option${n===t.sub?" selected":""}>${esc(n)}</option>`).join("")}</select>
 <label for="ef_l">Libellé</label><input id="ef_l" value="${esc(t.lbl||"")}" autocomplete="off">
 <label for="ef_c">Compte</label><select id="ef_c">${accs.map(a=>`<option${a===t.acc?" selected":""}>${esc(a)}</option>`).join("")}</select>
 <label for="ef_d">Date</label><input id="ef_d" type="date" value="${t.d}" required>
 <label style="display:flex;gap:10px;align-items:center;margin-top:12px;color:var(--ink)"><input type="checkbox" id="ef_o"${t.ok?" checked":""} style="width:auto"> Pointée</label>
 <button class="cta" type="submit">Enregistrer</button>${(()=>{const hx=!!t.hx;return`<div class="muted" style="margin-top:12px">${hx?"Cette opération est exclue des calculs de l'application (soldes, budgets, graphiques, bilans). Le tableur, lui, la compte toujours.":"Pour qu'une opération ne compte plus dans les soldes, budgets et graphiques de l'application, excluez-la : elle reste visible dans la liste. Le tableur la compte toujours."}</div><button type="button" class="cta sec" data-hx="${t.id}">${hx?"Inclure de nouveau dans les calculs":"Exclure des calculs"}</button>`})()}<button type="button" class="link d" data-tdel="${t.id}" style="margin-top:8px">Supprimer l'opération</button></form>`}
function viewTx(t){const c=checks().find(x=>x.t.id===t.id),T=allTx();
 const same=T.filter(x=>x.id!==t.id&&x.d===t.d&&x.acc===t.acc&&x.lbl===t.lbl&&x.amt===t.amt),ss=T.filter(x=>x.sub===t.sub&&x.amt<0),avg=ss.length?ss.reduce((q,x)=>q-x.amt,0)/ss.length:0;let why="";
 if(c){if(c.f.includes("Doublon"))why+=`<li>${same.length} autre(s) opération(s) identique(s) (même date, compte, libellé et montant) : ${same.map(x=>dfy(x.d)).join(", ")}. Si c'est un doublon de saisie ou d'import, supprimez-en une dans le classeur ; sinon c'est normal.</li>`;
  if(c.f.includes("inhabituel"))why+=`<li>Montant de ${eur(-t.amt)} contre ${eur0(avg)} en moyenne pour « ${esc(t.sub)} » (${ss.length} dépenses) : plus de 3 fois la moyenne. Un achat exceptionnel est normal ; sinon, vérifiez le montant.</li>`;
  if(c.f.includes("inconnue"))why+=`<li>La sous-catégorie « ${esc(t.sub)} » n'existe pas dans l'onglet Catégories : corrigez son nom dans Transactions ou ajoutez-la dans Catégories.</li>`}
 const ln=(a,b)=>`<div class="row"><span class="muted">${a}</span><span style="text-align:right;min-width:0;overflow-wrap:anywhere">${b}</span></div>`;
 return`<button class="link back" data-etx="">${route.eret?"‹ Retour":"‹ Opérations"}</button><div class="card"><b>Vérifier l'opération</b>${why?`<div class="msg" style="margin:8px 0"><b>Pourquoi elle est signalée :</b><ul style="margin:6px 0 0 18px;padding:0">${why}</ul></div>`:`<div class="muted" style="margin:8px 0">Cette opération n'est pas signalée.</div>`}
 ${ln("Date",dfy(t.d))}${ln("Libellé",esc(t.lbl||"–"))}${ln("Montant",`<b class="${t.amt<0?"neg":"pos"}">${eur(t.amt)}</b>`)}${ln("Sous-catégorie",esc(t.sub))}${ln("Catégorie",esc(prin(t.sub)))}${ln("Compte",esc(t.acc))}${ln("Pointée",t.ok?"Oui":"Non")}
 <div class="muted" style="margin-top:10px">Mode vitrine (lecture seule) : pour corriger, modifiez cette ligne dans l'onglet Transactions du classeur (la date, le libellé et le montant ci-dessus permettent de la retrouver), puis réimportez le classeur. Vous pouvez aussi passer en mode saisie pour la modifier ici, mais pensez alors à reporter la correction dans le tableur.</div>
 ${(()=>{const hx=!!t.hx;return`<div class="muted" style="margin-top:12px">${hx?"Cette opération est exclue des calculs de l'application (soldes, budgets, graphiques, bilans). Le tableur, lui, la compte toujours.":"Pour qu'une opération ne compte plus dans les soldes, budgets et graphiques de l'application, excluez-la : elle reste visible dans la liste. Le tableur la compte toujours."}</div><button type="button" class="cta sec" data-hx="${t.id}">${hx?"Inclure de nouveau dans les calculs":"Exclure des calculs"}</button>`})()}<button class="cta sec" data-novit="1">Passer en mode saisie</button></div>`}
function etxClose(){route.etx=null;if(route.eret){route.tab=route.eret.tab;route.sub=route.eret.sub;route.eret=null}}
function txKey(id){return Object.keys(S.months).find(k=>S.months[k].some(x=>x.id===id))}
function delTx(id){const k=txKey(id);if(!k)return;const old=clone(S.months[k]);S.months[k]=S.months[k].filter(x=>x.id!==id);saveMonth(k);vib();toast("Opération supprimée.",()=>{S.months[k]=old;saveMonth(k)})}
function togglePt(id){const k=txKey(id);if(!k)return;const x=S.months[k].find(z=>z.id===id);x.ok=!x.ok;saveMonth(k);vib();toast(x.ok?"Opération pointée.":"Pointage retiré.",()=>{const y=(S.months[k]||[]).find(z=>z.id===id);if(y){y.ok=!y.ok;saveMonth(k)}})}
const undoAdd=(k,id)=>()=>{S.months[k]=(S.months[k]||[]).filter(x=>x.id!==id);saveMonth(k)};
function upcoming(){const td=+TODAY.slice(8,10),out=[];S.cfg.recs.forEach((r,i)=>{if(!occurs(r,CUR)||r.active==="Non")return;const dom=Math.min(+r.next.slice(8,10)||1,28),dd=dom-td;if(dd>=0&&dd<=7&&recStatus(r,CUR)!=="Saisi")out.push({r,i,dd})});return out.sort((a,b)=>a.dd-b.dd)}
function saveMonth(k){S.empty=false;if(DB)queue(()=>DB.doc("tx/"+k).set({items:clone(S.months[k]||[])}));else saveLocal();render()}
function toast(t,undo){const e=$("toast");e.textContent="";const sp=document.createElement("span");sp.textContent=t;e.appendChild(sp);toast.u=undo||null;
 if(undo){const b=document.createElement("button");b.className="tu";b.dataset.undo="1";b.textContent="Annuler";e.appendChild(b)}
 e.hidden=false;e.classList.remove("pop");void e.offsetWidth;e.classList.add("pop");clearTimeout(toast.t);toast.t=setTimeout(()=>{e.hidden=true;toast.u=null},undo?6000:2600)}
const vib=()=>{try{if(localStorage.getItem("mc-vib")==="0")return;navigator.vibrate&&navigator.vibrate(12)}catch(e){}};
function lastGet(){try{return JSON.parse(localStorage.getItem("mc-last")||"{}")}catch(e){return{}}}
function lastSet(acc,sign,sub){try{const l=lastGet();l.acc=acc;(l.s=l.s||{})[sign]=sub;localStorage.setItem("mc-last",JSON.stringify(l))}catch(e){}}
/* ---------- utilitaires ---------- */
const MOIS=["janvier","février","mars","avril","mai","juin","juillet","août","septembre","octobre","novembre","décembre"];
const MC=["janv.","févr.","mars","avr.","mai","juin","juil.","août","sept.","oct.","nov.","déc."];
const eur=n=>(n<-0.004?"−":"")+Math.abs(n).toLocaleString("fr-FR",{minimumFractionDigits:2,maximumFractionDigits:2})+" €";
const eur0=n=>(n<-0.5?"−":"")+Math.abs(n).toLocaleString("fr-FR",{maximumFractionDigits:0})+" €";
const pc=n=>Math.round(n*100)+" %";
const R2=n=>Math.round(n*100)/100;
const now=new Date(),TODAY=now.getFullYear()+"-"+String(now.getMonth()+1).padStart(2,"0")+"-"+String(now.getDate()).padStart(2,"0");
const mOf=d=>(+d.slice(0,4))*12+(+d.slice(5,7)-1);
const kOf=m=>Math.floor(m/12)+"-"+String(m%12+1).padStart(2,"0");
const dOf=(m,day)=>kOf(m)+"-"+String(day).padStart(2,"0");
const dfr=d=>d?new Date(d+"T00:00:00").toLocaleDateString("fr-FR",{day:"numeric",month:"short"}):"";
const dfy=d=>d?new Date(d+"T00:00:00").toLocaleDateString("fr-FR",{day:"numeric",month:"short",year:"numeric"}):"";
const CUR=mOf(TODAY);
const num=s=>{const v=parseFloat(String(s).replace(/\s/g,"").replace("€","").replace(",","."));return isFinite(v)?v:NaN};
const cls=n=>n<-0.004?"neg":n>0.004?"pos":"";
function allTxRaw(){const a=[];for(const k of Object.keys(S.months).sort())for(const t of S.months[k])a.push(t);return a.sort((x,y)=>x.d<y.d?-1:x.d>y.d?1:0)}
function allTx(){return allTxRaw().filter(t=>!t.hx)}
const sgn=t=>[t.d,t.acc,t.lbl,t.amt].join("|");
const dot=i=>`<i class="dot" style="background:${COL(i)}"></i>`;
const catIdx=sub=>{const x=subOf(sub);return x?Math.max(0,S.cfg.cats.findIndex(c=>c.n===x.p)):6};
const ACOL={Courant:0,Épargne:2,Liquide:1,Carte:4,Autre:6};
const catOf=n=>S.cfg.cats.find(c=>c.n===n);
const subOf=n=>S.cfg.subs.find(s=>s.n===n);
const prin=s=>{const x=subOf(s);return x?x.p:"?"};
const uid=()=>"t"+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
/* ---------- calculs ---------- */
const inM=(t,m)=>mOf(t.d)===m;
function sums(m,txs){const a=(txs||allTx()).filter(t=>inM(t,m));const rev=a.filter(t=>t.amt>0).reduce((s,t)=>s+t.amt,0),dep=-a.filter(t=>t.amt<0).reduce((s,t)=>s+t.amt,0);return{rev,dep,sol:rev-dep,tx:a}}
function balances(){const T=allTx();return S.cfg.accounts.map(a=>({n:a.n,bal:a.init+T.filter(t=>t.acc===a.n).reduce((s,t)=>s+t.amt,0)}))}
const budOfCat=c=>S.cfg.subs.filter(s=>s.p===c).reduce((a,s)=>a+s.b,0);
const spentIn=(m,pred)=>-allTx().filter(t=>inM(t,m)&&t.amt<0&&pred(t)).reduce((s,t)=>s+t.amt,0);
function debtInfo(d){const rem=Math.max(0,d.cap-d.paid),r=d.rate/12;let n=0;
 if(rem>0&&d.pay>0){if(r===0)n=Math.ceil(rem/d.pay);else{const x=1-r*rem/d.pay;n=x>0?Math.ceil(-Math.log(x)/Math.log(1+r)):999}}
 return{rem,n,int:rem*r,pct:d.cap?(d.cap-rem)/d.cap:0}}
const PER={Mensuel:1,Trimestriel:3,Semestriel:6,Annuel:12};
function occurs(r,m){const p=PER[r.freq];if(!p||r.active==="Non"||!r.next)return false;const diff=m-mOf(r.next);return((diff%p)+p)%p===0}
const matches=(t,r)=>t.lbl.toLowerCase().includes(r.n.toLowerCase());
function recStatus(r,m){const T=allTx();const here=T.some(t=>inM(t,m)&&matches(t,r));if(here)return"Saisi";
 const day=Math.min(+r.next.slice(8,10)||1,28);return dOf(m,day)<=TODAY?"Absent":"À venir"}
function lastAmt(r){const T=allTx().filter(t=>matches(t,r));return T.length?T[T.length-1].amt:null}
function checks(){const T=allTx(),out=[];const keyc={};
 T.forEach(t=>{const k=[t.d,t.acc,t.lbl,t.amt].join("|");keyc[k]=(keyc[k]||0)+1});
